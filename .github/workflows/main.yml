name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Buildozer
      run: pip install buildozer cython kivy
    - name: Build APK
      run: |
        - name: Run Buildozer
  run: buildozer android debug

