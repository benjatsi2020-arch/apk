name: Build APK Real para Aitana
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el Repositorio del Bunker
      uses: actions/checkout@v3
    - name: Configurar Python de Alta Velocidad
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Instalar Herramientas Pesadas de Android
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip setuptools cython kivy buildozer
    - name: Ejecutar Compilacion Automatizada de Buildozer
      run: |
        yes | buildozer android debug
    - name: Guardar el Archivo APK de Regalo
      uses: actions/upload-artifact@v3
      with:
        name: misiones-android-apk
        path: bin/*.apk

 
